name: Android

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "parity/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.ARCANE_RELEASE_KEYSTORE_BASE64 != '' && secrets.ARCANE_RELEASE_STORE_PASSWORD != '' && secrets.ARCANE_RELEASE_KEY_ALIAS != '' && secrets.ARCANE_RELEASE_KEY_PASSWORD != '' }}
    outputs:
      has_release_signing: ${{ steps.signing.outputs.has_release_signing }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check release signing configuration
        id: signing
        run: echo "has_release_signing=${HAS_RELEASE_SIGNING}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Arcane-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_SIGNING == 'true'
        env:
          ARCANE_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARCANE_RELEASE_KEYSTORE_BASE64 }}
          ARCANE_RELEASE_STORE_PASSWORD: ${{ secrets.ARCANE_RELEASE_STORE_PASSWORD }}
          ARCANE_RELEASE_KEY_ALIAS: ${{ secrets.ARCANE_RELEASE_KEY_ALIAS }}
          ARCANE_RELEASE_KEY_PASSWORD: ${{ secrets.ARCANE_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ARCANE_RELEASE_KEYSTORE_BASE64"
          test -n "$ARCANE_RELEASE_STORE_PASSWORD"
          test -n "$ARCANE_RELEASE_KEY_ALIAS"
          test -n "$ARCANE_RELEASE_KEY_PASSWORD"
          echo "$ARCANE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arcane-release.jks"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_SIGNING == 'true'
        env:
          ARCANE_RELEASE_STORE_FILE: ${{ runner.temp }}/arcane-release.jks
          ARCANE_RELEASE_STORE_PASSWORD: ${{ secrets.ARCANE_RELEASE_STORE_PASSWORD }}
          ARCANE_RELEASE_KEY_ALIAS: ${{ secrets.ARCANE_RELEASE_KEY_ALIAS }}
          ARCANE_RELEASE_KEY_PASSWORD: ${{ secrets.ARCANE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_SIGNING == 'true'
        run: |
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --verbose app/build/outputs/apk/release/*-release.apk
          cp app/build/outputs/apk/release/*-release.apk "Arcane-${GITHUB_REF_NAME}.apk"

      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Arcane-release-signed-apk
          path: Arcane-${{ github.ref_name }}.apk
          if-no-files-found: error

      - name: Skip signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_SIGNING != 'true'
        run: echo "Release signing secrets are not configured; debug APK artifact was uploaded."

  instrumented:
    name: API 30 instrumented tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run deterministic Compose and route tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

  publish-release:
    name: Publish signed release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.has_release_signing == 'true'
    permissions:
      contents: write

    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Arcane-release-signed-apk
          path: .

      - name: Attach signed APK to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Arcane-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
